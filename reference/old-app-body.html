<body>
<div id="app">
  <div id="map"></div>

  <div class="chrome-top">
    <div class="header-pill glass">
      <div class="header-top-row">
        <div class="wordmark">Faisal's <em>London</em></div>
      </div>
      <div class="stat-row" id="statRow"></div>
      <div class="search-row">
        <span class="search-icon"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg></span>
        <input type="text" id="searchInput" placeholder="Search places, food, vibes...">
      </div>
    </div>
    <div class="chip-row" id="chipRow"></div>
  </div>

  <div class="side-rail">
    <button class="rail-btn" id="locateBtn" aria-label="Use my location">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>
    </button>
    <button class="rail-btn theme-toggle" id="themeToggle" aria-label="Toggle theme">
      <svg id="themeIcon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
    </button>
  </div>

  <div class="overlay" id="overlay"></div>
  <div class="sheet glass" id="sheet">
    <div class="sheet-handle"></div>
    <div id="sheetContent"></div>
  </div>
</div>
