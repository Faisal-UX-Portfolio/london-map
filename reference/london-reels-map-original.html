So whether you’re looking for Asian groceries, noodles, dumplings, MOCHI - you can find it all here🎉. \n\nI loved this supermarket, there was so much variety here at such an affordable price. I highly recommend @yohomeorientalsupermarket!! \n\n[invite/ad]\n\n#asian #asiansupermarket #londonfood #orientalsupermarket #hotpot #mangopancake #noodles #london #hammersmith #trendingreels #trendingaudio #2024 \n\nAsian Supermarket In London | Hotpot in London | Mango Pancake | London Food Influencer | London Food Blogger | Trending Reels | Trending Audios | Foodie | Viral | Explore Page |", "owner": "mel | london food & travel blogger", "category": "activity", "rating": null, "rating_count": null, "price_level": null, "hours": null}, {"place_name": "Dolce VyTA by Matteo Manzotti", "lat": 51.5116016, "lng": -0.1228217, "address": "46 The Market, London WC2E 8RD", "reel_url": "https://www.instagram.com/reel/C0toCeLI-Mb/", "caption": "@dolcevyta_matteomanzotti have brought there Maritozzi to Covent Garden. It’s pastries like this, that will always have me saying to sweet over savoury. An iconic pastry coming out of Rome! A slightly sweet brioche bun, filled with freshly whipped chantilly cream & traditionally dusted with icing sugar, here you have the option to dip it in pistachio or chocolate too😫😍\n\nThese were heavenly!! The brioche bun was soft, slightly sweet & the cream was light, so smooth & also just the right amount of sweet. My favourite flavour was the chocolate. It just added a little something different, especially with the crushed chips on top😍\n\nThese are definitely something to get stuck into behind closed doors. As good as they look, an absolute mess to eat! One bite & the creams bulging out either side. Be patient, wait till you get somewhere out of sight & use a knife & fork😂\n\nThe Order:\n\n🥮 Chocolate £6\n🥮 Pistachio £6.50\n🥮 Icing Sugar £4\n\n#foodporn #food #pastry #dessert #maritozzo #maritozzi #brioche #cream #bakery #london #reels", "owner": "Kieran Monlouis | Foody Fella", "category": "restaurant/food", "rating": null, "rating_count": null, "price_level": null, "hours": null}, {"place_name": "Kung Fu Noodle", "lat": 51.511755, "lng": -0.1321922, "address": "64 Shaftesbury Ave, London W1F 6LU", "reel_url": "https://www.instagram.com/reel/Cz3hMd4ScFC/", "caption": "Viral noodle restaurant in Chinatown 🍜\n\nIf you're looking to slurp on bowls of fresh hand-pulled noodles, head to @kungfunoodleuk immediately. This noodle bar has been a popular topic of conversation, known for their generous portions and flavoursome, fiery dishes 🙌🔥\n\nExplore the menu, select your desired noodle size, and enjoy.\n\n#chinatownlondon #noodlepull #noodles #winterdishes #londonfoodies #londoneats", "owner": "Chinatown London", "category": "restaurant/food", "rating": null, "rating_count": null, "price_level": null, "hours": null}, {"place_name": "The Pelican, Notting Hill", "lat": 51.5187926, "lng": -0.2047072, "address": "45 All Saints Rd, London W11 1HE", "reel_url": "https://www.instagram.com/reel/CzwdzcqIctW/", "caption": "AFFORDABLE HALAL SEAFOOD FOR UNDER £9.99 🥵🦞!!\n\nI stumbled upon this hidden gem of a halal seafood and chicken joint, and let me tell you, the seasoning here is nothing short of interesting, it really sets them apart 🌶️. \n\nI genuinely did not expect @pelican.state to be as good as it was but everything was so well seasoned that it took me by suprise! It made every dish memorable. \n\nThey also have a some very affordable lunchtime and other deals so this place is definitely affordable 💷.\n\nStarters:\n\n- House Salad (7.8/10): A delightful mix with a tangy vinaigrette dressing. A solid start.\n- Nachos & Guacamole (7.5/10): Loaded with salsa and guacamole, but missed the meat or cheese touch. Still, a satisfying bite.\n- Crispy Chicken Strips with Voodoo Sauce (6.5/10): Nicely seasoned, albeit a tad dry.\n- Crunchy Mac n Cheese Balls (6.8/10): Good crunch and a flavorful filling.\n\nMains:\n\n- Seafood Platters (7.9/10): Choose grilled or fried, both fantastic with Louisiana and Cajun seasoning. Fried stole my heart.\n- Fried Prawn Roll (7.5/10, potential for 8/10): Crispy prawns in a fluffy brioche roll, impeccably seasoned. Just watch out for the attached prawn tail.\n- Prawn Jambalaya (8.5/10): A standout dish. Perfectly seasoned, cooked, and complemented by a divine sauce.\n- Pelican Fish Burger (7.8/10): Soft, tender fish fillets in a crispy coating. Pakistani fried fish pakoras vibes, wonderfully seasoned.\n- Soft Shell Crab Burger (8.2/10): A surprising hit with a whole crispy soft-shell crab. Unbeatable seasoning.\n\nDessert:\n\n- Sorbet in Fruit: A playful touch serving coconut, orange, or lemon sorbet inside the fruit.\n\n[halal seafood, lobster rolls, grilled lobster, prawns, cod, fish and chips, fish n chips, london sea food spots, best restaurants, top restaurants in london, halal restaurants, seafood grill, halal food in london, best food spots, food photography, foodie, halal date night, American food, london food, london cuisine, foodie favourites, must-try dishes, best restaurant, london must visit, best cod, restaurant review, food review, must try, must visit, london eats, seafood boil, sea food boil, crab, burger and lobster, burger n lobster]\n\n*Invite/PR", "owner": "LONDON FOODEE | Halal Food", "category": "restaurant/food", "rating": null, "rating_count": null, "price_level": null, "hours": null}, {"place_name": "Pahli Hill Bandra Bhai", "lat": 51.5176102, "lng": -0.1409363, "address": "79-81 Mortimer St, London W1W 7SJ", "reel_url": "https://www.instagram.com/reel/CyNsRvGAa7M/", "caption": "This speakesy bar in London is a retro Indian smugglers den located in the basement of @pahlihillbandrabhaiuk in Fitzrovia. Bandra Bhai is a tribute to underground operations of years gone by and is now a groovy basement spot serving some of the best cocktails / mocktails in London 🥂 They also serve food downstairs if you’re having munchies 😜 \n\n.\n.\n.\n\n n, it will blow you away", "owner": "Secret London", "category": "restaurant/food", "rating": null, "rating_count": null, "price_level": null, "hours": null}, {"place_name": "Spagnoletti", "lat": 51.5298687, "lng": -0.1237709, "address": "23 Euston Rd, London NW1 2SD", "reel_url": "https://www.instagram.com/reel/CwCeSqloGpN/", "caption": "London’s quirkiest pasta spot 🤔\n\nAD-INVITE | @spagnoletti_ is one of the coolest pasta spots in London with a very quirky futuristic interior and a telephone box! Situated in King’s Cross, it has two very cool floors.\n\nWe had:\n- Burrata (£11)\n- Charcoal arancini (£7)\n- Njuda rigatoni (£13)\n- Lobster tagliolini (£23.50)\n- Coconut pannacotta (£7)\n- Tiramisu (£7)\n\nI would say this place is priced very reasonably for fresh pasta and really good food. This place feels really special for some reason - it’s a bit quirky but the food is genuinely tasty. The rigatoni I had was lovely and the tiramisu was strong but very moreish. It was made even more special as we ended up talking to two lovely Canadian ladies sat next to us about life 😂 I’d definitely recommend this place for a catch-up or chilled date night!\n\nLocation: King’s Cross\nPrice: ££\nRequirements: veggie options available, don’t think it’s Halal\n\n#londonitalianfood #italianfood #londonpasta #londoners #londoneats #northlondon #kingscross #kingscrosslondon #stpancrasinternational #londonfoodguide #londonfoodblogger #pastalover #pastalondon #italianfoodporn #discoverunder200k #londondinner #londontrip #reellife #reelsteady #newreels #discoveringlondon #timeoutlondon #thisislondon #foodielondon #foodlondon #inlondon #londonlondon", "owner": "Ruchi | Food and Travel", "category": "activity", "rating": null, "rating_count": null, "price_level": null, "hours": null}, {"place_name": "Angry Crab Shack", "lat": 51.5105652, "lng": -0.1324771, "address": "19a Rupert St, London W1D 7PA", "reel_url": "https://www.instagram.com/reel/CuY7c57Ile-/", "caption": "ad If you’re looking for the ultimate seafood experience, head to @angrycrabshacklondon \n\nIt’s the first restaurant that was set up in Europe.\n\nTheir mouthwatering seafood boils are made with the freshest ingredients and served with a perfect blend of spices and seasonings.\n\nTrust us, one bite and you’ll be hooked!\n\n#AngryCrabShack #seafoodboils #londonrestaurants #seafoodrestaurant", "owner": "Merissah", "category": "activity", "rating": null, "rating_count": null, "price_level": null, "hours": null}, {"place_name": "Sheesh Mayfair", "lat": 51.5076583, "lng": -0.141273, "address": "67-69 Piccadilly, London W1J 0HJ", "reel_url": "https://www.instagram.com/reel/CtgtSoQoE2Z/", "caption": "Stunning Turkish restaurant in Mayfair ❤️\n\nWas so excited to visit @sheesh_uk’s new location in Mayfair, where we got to try their Turkish inspired dishes with modern twists. We ordered:\n\nCheesy pastry rolls 🧀 £14\nSizzling shrimp 🍤 £19\nCalamari 🦑 £26\nHalloumi cheese 🧀 £12\nCheesy mushrooms 🍄 £15\nLobster pasta 🦞 £32\nLamb chops 🐑 £45\nChicken Sheesh 🍗 £32\nSunset rice 🍚 £8\nHand cut chunky chips 🍟 £7\nSheesh donuts 🍩 £10\nStrawberries & cream 🍓 £10\n\nReally enjoyed the food, especially the calamari, shrimp, lobster pasta & chicken Sheesh which were all 10’s 😍 the cocktails were so delicious and strong too 🍹 and loveddd the desserts especially the Oreo donuts 🤤 the prices are quite high but the portions are huge and the food is fresh & delicious. \n\nPerfect for a special occasion🙌 ad", "owner": "Sarai AV", "category": "restaurant/food", "rating": null, "rating_count": null, "price_level": null, "hours": null}, {"place_name": "Bursa Restaurant", "lat": 51.5148863, "lng": -0.162998, "address": "1 Connaught St, Tyburnia, London W2 2BH", "reel_url": "https://www.instagram.com/reel/Cqh0aEDoXgC/", "caption": "This traditional Turkish Breakfast (Kahvalti) is the best way to start any day 🇹🇷🍳 Ad\n\n@bursakebapevi_london is serving up a huge breakfast platter with delicious hot and cold meze a uver Food", "category": "activity", "rating": null, "rating_count": null, "price_level": null, "hours": null}, {"place_name": "Comptoir Bakery, Bermondsey", "lat": 51.500811, "lng": -0.0819699, "address": "96 Bermondsey St, London SE1 3UB", "reel_url": "https://www.instagram.com/reel/CrNvK0-MYUJ/", "caption": "4x MUST TRY PASTRIES 🥐 THAT NEED TO BE ON YOUR 💨 📝- if you love a cheeky morning bun then make sure you save this post 😉 \n\n1. @comptoirg \n2. @fortitudebakehouse \n3. @jolenewellstreet \n4. @aromebakerylondon \n\nWhich will you choose? \n\n🌟 If you can’t take a date, take a mate! TAG TAG TAG x \n\n#londonfoodblogger #londonfoodie #londonfood #londonreels #londonrestaurants #londonhiddengems #londoneats #wheretoeatlondon #londonfoodguide #bestlondonrestaurants #hiddengems #coffee #pastry #breakfastlondon #foodie  #breakfast #donuts #pastries #bakery", "owner": "Eating With Tod", "category": "restaurant/food", "rating": null, "rating_count": null, "price_level": null, "hours": null}, {"place_name": "Tsukiji Sushi Fusion", "lat": 51.4286771, "lng": -0.1665712, "address": "Unit 68, 29 Tooting High St, London SW17 0RJ", "reel_url": "https://www.instagram.com/reel/Crx4WLEIKv1/", "caption": "@tsukiji_tootingbroadway in Tooting Broadway Market have a deal on every Tuesday to Thursday where you can enjoy unlimited sushi, tempura prawns, gyozas, miso soup & edamame for £25pp👀\n\nI was shocked when I heard about this deal. Almost too good to be true! My thought straight away was, the food has to be lacking quality… Oh how I was wrong. The sushi was fresh & everything had its own unique flavour. Sometimes you can find with sushi platters they all taste the same. Not here! All kinds of variety, they even had one with a chunk of mango inside which was top 2 for me😍\n\nThe prawn tempura was fresh & gyozas also great! They have chicken & vegetable gyozas. I also love miso soup so got two rounds of that😅\n\nLocated inside a buzzing Tooting Broadway Market & this is literally a place to just vibe & eat good sushi. Don’t expect fancy seating & lush interiors.\n\nP.s who knows about wasabi in soy sauce? 👀\n\nThe Order:\n\n🍣 ALL YOU CAN EAT SUSHI £25pp\n\nOverall = 4.5/5\n\nInvite*\n\n#food #foodie #foodporn #sushi #tempura #platter #london #restaurant #tooting #reels", "owner": "Kieran Monlouis | Foody Fella", "category": "activity", "rating": null, "rating_count": null, "price_level": null, "hours": null}, {"place_name": "Veeraswamy", "lat": 51.509983, "lng": -0.1378045, "address": "Victory House, 99 Regent St, London W1B 4RS", "reel_url": "https://www.instagram.com/reel/CrjF9rWI9JI/", "caption": "LONDONS OLDEST RESTAURANTS: PART 1 🕰️\n\nWelcome to my new series where we explore the oldest and timeless restaurants in London. I had to start off with my favourite cuisine and show you the oldest Indian restaurant in London and in the country… @veeraswamy.london 🇮🇳\n\n@veeraswamy.london was established in 1926 by the great-grandson of an English General and an Indian Mughal princess, it soon became a fashionable rendezvous hotspot amongst the rich and famous, who were drawn not only to its remarkable cuisine style but also to its Raj inspired opulent interiors. \n\nThe style of the food has evolved a lot over the years. Steering away from traditional dishes and using European influence for its fine dining menu. My top recommendations are:\n\n🇮🇳 Butter Chicken au Vin\n🇮🇳 Patiala Lamb shank slow cooked for 6 hours, with marrow sauce\n🇮🇳 Chicken Momos\n🇮🇳 Tandoori Wild Tiger Prawns\n🇮🇳 Kala Jaam \n££££\n\nLet me know which cuisine I could cover next 👀?\n\n.\n.\n.\n.\n.\n.\n.\n.\n.\n.\n.\n.\n.\n.\n#londonfoodblogger #londonblogger #londonfoodies #londonindianfood #wheretoeatlondon #londonfinedining #reels #reelsinstagram #reelitfeelit #foodreels #londonhotspots #londonrestaurants #londoneats #centrallondonfood #londonrestaurant #discoverunder200k", "owner": "Fari🍚 | London Food and Travel Blogger", "category": "activity", "rating": null, "rating London W1D 4TA", "reel_url": "https://www.instagram.com/reel/C_gEHahIkJQ/", "caption": "HUNTING FOR THE BEST NOODLES IN LONDON 🍜 \n\nNew opening just outside of Chinatown near Leicester Square - they don’t have instagram 😂 it’s called Noodle Inn. I love how the kitchen takes centre stage and you can just watch them cook 👨🏻‍🍳 \n\nI haven’t had a huge amount of noodles in my time haha but these are the best I’ve had… let me know in the comments the best noodle spots! Let’s get this hunt started… 🔥 \n\n🌟 If you can’t take a date, take a mate! Tag tag tag x \n\n#chinatown #noodle #noodles #foodie #london #londonfood #cheapeats #cheap #lunch #foodporn #foodlover #foodreels", "owner": "Eating With Tod", "category": "restaurant/food", "rating": null, "rating_count": null, "price_level": null, "hours": null}, {"place_name": "AMANO Rooftop Bar", "lat": 51.5137201, "lng": -0.1202297, "address": "Drury House, 34-43 Russell St, London WC2B 5HA", "reel_url": "https://www.instagram.com/reel/DI1naxgiyoT/", "caption": "Amano’s Rooftop, Covent Garden.\n\n#explore #PlacesToVisit #london #rooftop #aestheticvibes", "owner": "Abbz", "category": "other", "rating": null, "rating_count": null, "price_level": null, "hours": null}, {"place_name": "K. Minamoto, Piccadilly", "lat": 51.5086558, "lng": -0.1376556, "address": "193 Piccadilly, London W1J 9EU", "reel_url": "https://www.instagram.com/reel/DIW0ywzogxM/", "caption": "This is the FIRST and ONLY Authentic Japanese Confectionery Shop in London\n\nWAGASHI is traditional Japanese confectionery and it has become an important part of Japanese culture. We were so excited to check it out.\n\nYou can currently have a set of sencha japanese tea and strawberry cake for £8.50\n\nWe started by having some delicious matcha. The slight bitterness of matcha really complimented the sweetness of what to follow. \n\nMy favourites are: \n\nTSUYA (Dorayaki) Sweet red bean paste sandwiched in Japanese-style pancake. \n\nMATCHA MOCHI Sweet red bean paste wrapped with soft rice cake coated with green tea powder.\n\nKASUTERA Fluffy and moist Japanese sponge cake (castella). \n\nUSAGI SAN Bunny-shaped cake filled with a lightly sweetened white bean paste and Yuzu citrus.\n\nJAPANESE JELLY\n\nYou must check it out!!! It’s so goodddddd 🇯🇵🇯🇵🇯🇵🇯🇵🇯🇵\n\n#japanesefood #japanesecandy #japanesesweets #japanesecafe #londonfood #dorayaki #mochi #asianboy #londoneats #matcha #japaneseconfectionery #wagashi #japaneseculture #japanesecuisine", "owner": "Alex | fashionable foodie", "category": "restaurant/food", "rating": null, "rating_count": null, "price_level": null, "hours": null}, {"place_name": "CLAP KA-FE", "lat": 51.5009017, "lng": -0.1610028, "address": "12-14 Basil St, London SW3 1AJ", "reel_url": "https://www.instagram.com/reel/DH2_QaqoM7Y/", "caption": "New Japanese inspired KA-FE by @claplondon @kafelondon just (this morning!)opened in Knightsbridge next to the restaurant and they have a great variety of breakfast and lunch options and desserts inspired by the 🇯🇵 cuisine like these crepe matcha cheesecake, shiitake salted caramel st honore, strawberry shiso milefuille and coffees like miso caramel or kinako latte! Such a lovely addition to the area! And the first 100 people will get a tumbler with a bespoke manga illustrated by @kristina.m.stipetic ! Loving my girl design!! Thanks for the preview! PR invite #londonfood #londoncoffeeshops #londoncoffeecups", "owner": "eatnlondon 🍰🍒🥂🍓🌸", "category": "restaurant/food", "rating": null, "rating_count": null, "price_level": null, "hours": null}, {"place_name": "Coq d'Argent (Lodge d'Argent)", "lat": 51.5134888, "lng": -0.0911834, "address": "1 Poultry, London EC2R 8EJ", "reel_url": "https://www.instagram.com/reel/DCNQ-ojueAC/", "caption": "Lodge d'Argent is here! Book Chalet on our Apres Ski themed rooftop this Winter. Seats up to 8 guests with hot cheese fondue, charcuterie and luxury espresso martinis from Courvoisier. ⁠\n⁠\nBookings available at our linkinbio until Mar 2nd. ⁠\n⁠\n£300 minimum spend on your booking, with no time limit in the evenings!⁠\n#thisislondon #timeoutlondon #londonrestaurants #toplondonrestaurants #infatuationlondon #foodiesoflondon #christmasexperience #thingstodoinlondon #londonrooftop", "owner": "Coq D'Argent", "category": "activity", "rating": null, "rating_count": null, "price_level": null, "hours": null}, {"place_name": "The Garden at 120", "lat": 51.5121702, "lng": -0.0809375, "address": "120 Fenchurch St, London EC3M 5BA", "reel_url": "https://www.instagram.com/reel/C_DNF02o6Gl/", "caption": "The Garden at 120 is one of the most beautiful free rooftops in London, offering stunning 360-degree views of London landmarks such as the Gherkin, Tower Bridge, the Shard, and 20 Fenchurch Street. It’s perfect for a family day out or a Saturday morning with friends.\n\nNo ticket or booking is required unless you are a group of 12 or more. Happy Saturday! ❤️\n\n120 Fenchurch St 📍\n\n#londonrooftops #londonviews #explorelondon #londonskyline #familydayout #freethingstodoinlondon #thegardenat120 #londonlife #visitlondon #cityoflondon #placestovisitinlondon #londonplaces #weekendvibes #cityviews #londra #travel #traveldestination", "owner": "GIOACCHINO RUSSO | LONDON | UK", "category": "activity", "rating": null, "rating_count": null, "price_level": null, "hours": null}, {"place_name": "NIU HOT POT", "lat": 51.5170996, "lng": -0.0735808, "address": "43 Commercial St, London E1 6BD", "reel_url": "https://www.instagram.com/reel/C_Fpe9oKHWF/", "caption": "HOTPOT 😍 from @niuhotpot in Aldgate 👌🏼 \n\nThis new joint has lots of halal options and is @halalfriendlylist_ certified (go to www.halalfriendlylist.com/Niu for further details) 🤩\n\nWe tried a half and half hot pot, with a tom yum base and a spicy base 🌶️ \n\nFor our dipping items we got all of their halal meats: sirloin, rump, sliced beef 🥩 \n\nWe also got a seafood platter, mushrooms, ramen, veggies and tofu- my fave was the mushroom 🍄 \n\nThe best part is their condiment bar with a load of oils, sauces, condiments and herbs! So you can make your own dipping sauce 👌🏼\n\nTheir desserts were also surprisingly good- you have to try their fried rice cake with brown sugar sauce, it was so crispy yet chewy! Ask for some condensed milk sauce on the side as it tasted amazing with that 🥛 \n\nOverall this was a great place and you have to check them out 🤤\n\n🍴: They are @halalfriendlylist_ certified with a partial halal menu, go to www.halalfriendlylist.com/Niu for further details\n📍: Aldgate\n🕌: Nearest place to pray @eastlondonmosque \n💷: Depends how much you order, expect to spend a minimum of £20-£30pp\n⭐️: Ample seating, very clean place \n\n#hotpot #halalfoodlondon #niuhotpot", "owner": "HALAL FOOD LONDON • حلال", "category": "restaurant/food", "rating": null, "rating_count": null, "price_level": null, "hours": null}, {"place_name": "Miami Crispy, Ilford", "lat": 51.5902524, "lng": 0.0495303, "address": "2 Claybury Broadway, Ilford IG5 0LQ", "reel_url": "https://www.instagram.com/reel/C-Py3gXI_Ik/", "caption": "Miamis has fianlly opened in London, the best spicy burger in london. No need to drive to Manchester again 😂😂.\n\nLocation - 2 Claybury Broadway, Ilford IG5 0LQ 📍\n\n#placestoeatinlondon #halalfoodie #foodineastlondon  #food #londonfood #londonfood #halallondonfoood #londonfoodspots #londonfoodguide #ondonfoodblogger\n#londonfoodplaces #londonfoodscene #spicydipchickenburger \n#miamicripsy #miamiburger #fyp #miami", "owner": "Sahileats", "category": "restaurant/food", "rating": null, "rating_count": null, "price_level": null, "hours": null}, {"place_name": "Alma Bar (Sucre)", "lat": 51.5143142, "lng": -0.1382852, "address": "47b Great Marlborough St, London W1F 7JP", "reel_url": "https://www.instagram.com/reel/C9U2Qgusofn/", "caption": "Moody interiors, great plates from @sucre.london and the most beautiful cocktails; this spot definitely needs to be your next date night spot 🤩 📍@almabarlondon, W1F 7JP", "owner": "Secret London", "category": "restaurant/food", "rating": null, "rating_count": null, "price_level": null, "hours": null}, {"place_name": "INKO NITO, Soho", "lat": 51.5130582, "lng": -0.1372415, "address": "55 Broadwick St, Carnaby, London W1F 9QS", "reel_url": "https://www.instagram.com/reel/C6f-esCoVBK/", "caption": "One of London’s best 🤯\n\nAD-INVITE | @inkonitolondon is a sister restaurant to the famous Roka and Zuma restaurants and I would argue that it serves up a similar level of high quality dishes. We tried their express menu which is very affordable for such a high quality spot! This included:\n- Edamame\n- Steamed prawn and leek dumplings \n- Korean fried cauliflower maki\n- Japanese karaage with peanut and chilli yoghurt\n- A choice of main course (pork belly, salmon or tofu)\n- Rice\n\nThis meal is super filling and only £27. I think it’s incredible value for money and the tofu is one of the best tofu dishes I’ve ever had. You can add on dessert (mochi) for £3 too! I definitely loved all the flavours and I think this has to be one of my favourite Japanese spots in the city which is unsurprising considering I really liked Roka 😂 This menu is available all day from Monday to Thursday and 12-5pm on Fridays. My friend loved it so much, she said she’d come back so that’s a testament to how good it is 👀\n\nLocation: Oxford Circus\nPrice: ££-£££\nRequirements: vegetarian options available, not sure if Halal\n\n#londonjapanesefood #japanesefood #affordablelondon #londonguide #visitlondon #oxfordcircus #centrallondon #placestovisitinlondon #eatinglondon #eatlondon #inlondon #foodinlondon #londoneats #dinnerlondon #londonlunch #londoncheapfood #hiddenlondon #reeltofeel #reeloftheday #londonbylondoners #londonjapaneserestaurant #londonblogger #londonfoodblog #londonrecommendations #exploringlondon #londontrip #londonvisitof", "owner": "Ruchi | Food and Travel", "category": "restaurant/food", "rating": null, "rating_count": null, "price_level": null, "hours": null}, {"place_name": "ARgENTUM", "lat": 51.5097587, "lng": -0.2100462, "address": "119 Portland Rd, London W11 4LN", "reel_url": "https://www.instagram.com/reel/C66lwnEIpZb/", "caption": "This magical skincare and fragrance café in Notting Hill lets the tarot-inspired cards do the talking when it comes to finding your signature scent 🔮 Visit @argentum for a personal fragrance reading and find out whether you’re an explorer, a creator, a lover, or something else entirely ✨\n\n#beautyandfashion", "owner": "Secret London", "category": "restaurant/food", "rating": null, "rating_count": null, "price_level": null, "hours": null}, {"place_name": "Mozart Concierge Flowers Boutique", "lat": 51.4906704, "lng": -0.1671861, "address": "26 Cale St, London SW3 3QU", "reel_url": "https://www.instagram.com/reel/C6t5tD-oboh/", "caption": "London's prettiest coffee shop @mozartconcierge 😍\n\nIt's also a flower shop and they do the cutest flower & coffee bundles 💐 They've got a selection of mini bouquets that you can choose from. \n\nI went for an iced oat latte which was nice - probably should have got it with a bit of syrup in it! \n\nIt's such a cute idea 💖 if you get the chance, go check it out.\n\n#londoncoffeeshops #londoncafe #londonflowers #londonflowershop #prettylittlelondon #prettycitylondon #visitlondon #mozartconcierge #timeoutlondon #londonbloggerlife", "owner": "Rasha | Food and Travel Blogger", "category": "restaurant/food", "rating": null, "rating_count": null, "price_level": null, "hours": null}, {"place_name": "Ronnie Scott's", "lat": 51.5134706, "lng": -0.131535, "address": "47 Frith St, London W1D 4HT", "reel_url": "https://www.instagram.com/reel/C6eKfUwMjSL/", "caption": "Clubbing is fun but…my kind of night in London is more on the jazzier side…\n\n(P.S. - my answer’s a 🍸 Negroni to the question in the video…what’s yours?) \n\nRonnie Scott’s is one of London, and the world’s, most iconic jazz clubs 🎷 Kicking it since 1959 with pretty much every famous jazz artist performing here at least once \n\nIn other words…if you’re tired of basic nights out in London (aren’t we all?), a jazzy night in Soho is all you need x\n\n📌 PRACTICAL INFO \n\nYou can either go to the ‘Main Show’ (books up fast in advance and is £30 - £55 per ticket with seating) or ‘Upstairs @ Ronnies for a more informal Jazz Jam session and buy tickets on the door for £10. Drinks are pretty reasonable for London standards at about £12 - £13 for a cocktail and the music and vibes are incredible. They’re open every day. \n\nHappy Londoning, \n\nCandace x\n\nP.S. - For more London & travel recommendations be sure to give me a follow, if you fancy :)\n\n—\n#londonblogger #londoninfluencer #londonjazz #londonjazzclubs  #ronniescotts", "owner": "Candace Salters | London, UK & Europe Travel", "category": "activity", "rating": null, "rating_count": null, "price_level": null, "hours": null}, {"place_name": "The Lowdown", "lat": 51.5105486, "lng": -0.1241041, "address": "38 Bedford St, London WC2E 9EN", "reel_url": "https://www.instagram.com/reel/C4_PSBWIWKH/", "caption": "The Lowdown in Covent Garden 🌸\n\nA spot you need to add to your list with beautiful interiors, brunch plates and some GREAT coffee. Make memories this Easter weekend with Ambl and discover your city 📲\n\n#bookonambl #ambl #london #brunchspot #thelowdown #coventgarden #brunch #brunchfood #hiddengem #foodinlondon #easterweekend #coffeeinlondon #brunchspotinlondon", "owner": "Ambl | Book London's Best Restaurants & Bars", "category": "restaurant/food", "rating": null, "rating_count": null, "price_level": null, "hours": null}, {"place_name": "Singapulah", "lat": 51.5119378, "lng": -0.1323674, "address": "53 Shaftesbury Ave, London W1D 6LB", "reel_url": "https://www.instagram.com/reel/C4Ibk4jINqE/", "caption": "✨NEW✨ Viral Singaporean restaurant in London 🇸🇬\n@ellen_chew brings you this restaurant and shop that brings you the best of Singapore.\nExamples from the current menu are:\nLaksa with silver pin noodles £16.95\nWonton Mee £14.95\nNasi Lemak £16.95 (with either ayam goreng but a vegan version with eggplant is available too)\n\nThey also offer larger sharing plates including the famous Singapore chilli crab and beef rendang. Loved the selection of Kuih for dessert because that’s the thing I find the hardest to find in London.\nI know some people have been complaining about the prices online but at the end of the day, these are London prices, with London portions to match (you’ll never find a wonton mee of that portion size back home!). I think this place is still great if you want a taste of home away from home and is a great addition to the London dining scene. \nShoutout to Ellen herself for coming over to us when she was dining with her friends and asking if we wanted more takeaway boxes - the true sign of how much care she has put into opening this restaurant and that the service here is top quality. \n@visit_singapore \n*PR invite\n#londonfood #eseaeats #londonhotspots #londonfoodscene #londoneats #chinatownlondon #singaporeanfood #londonfoodguide", "owner": "Yee Wen • London food blogger", "category": "restaurant/food", "rating": null, "rating_count": null, "price_level": null, "hours": null}, {"place_name": "Camden Market, Hawley Wharf", "lat": 51.5415543, "lng": -0.1448825, "address": "1 Dockray Pl, London NW1 8QH", "reel_url": "https://www.instagram.com/reel/C3fTv7OIruO/", "caption": "每次放假都坐一小時車去吃米線的老娘\n這次拜訪一下傳說中好好吃的神羊米線◔◡◔ \n@holysheep.uk \n在Hawley Wharf Food court二樓 目測生意最好的店耶!\n平常只吃清湯的老娘決定遠道而來試一試酸辣\n小辣也辣得不行耶🥲 \n炭燒雞肉跟炭燒肥牛都超好吃 不過等餐時間會比較長一點\n米線是Q彈款的 超好嚼 整體不錯!\n(但我和朋友吃完都口渴超久)\n|\n📍Camden, London\nUnit 197, 2nd floor, Hawley Wharf, London NW1 8AA\n|\n#srsly_london #londonfood #倫敦 #camden #倫敦美食", "owner": "𝑨 𝑺𝒆𝒓𝒊𝒐𝒖𝒔 𝑭𝒐𝒐𝒅 𝑩𝒍𝒐𝒈✨ 𝑭𝒐𝒐𝒅 & 𝑻𝒓𝒂𝒗𝒆𝒍 𝑮𝒖𝒊𝒅𝒆", "category": "restaurant/food", "rating": null, "rating_count": null, "price_level": null, "hours": null}, {"place_name": "Chai Guys Bakehouse", "lat": 51.5156811, "lng": -0.205041, "address": "193 Portobello Rd, London W11 2ED", "reel_url": "https://www.instagram.com/reel/C10ELUWMFCb/", "caption": "Hot chai on a winters day is perfection🧸🌬️ \n\nChai Guys Bakehouse, London📍\n\nPR invite \n\nWatch - gifted by @d1milano \n\n#london #thingstodoinlondon #londoncafe #londonfoodie #londonhotspots #londoncityguide #londonhiddengems #uktravel #prinvite #gifted #d1milano #d1milanowatch", "owner": "Kajol | Spaces and Places", "category": "restaurant/food", "rating": null, "rating_count": null, "price_level": null, "hours": null}, {"place_name": "Donia", "lat": 51.512541, "lng": -0.1389043, "address": "2.5 Top Floor, Kingly Ct, Carnaby St, London W1B 5PW", "reel_url": "https://www.instagram.com/reel/C1en9xkKj8K/", "caption": "BRB going back to Covent Garden for Donia’s ube choux dessert. Follow us for the full review coming soon.\n\n#donia #donialondon #InfatuationLondon #filipinofood #londonhotspots", "owner": "Infatuation London", "category": "restaurant/food", "rating": null, "rating_count": null, "price_level": null, "hours": null}, {"place_name": "Chinatown Bakery - Tong Tea", "lat": 51.5108058, "lng": -0.1318716, "address": "9 Wardour St, London W1D 6PF", "reel_url": "https://www.instagram.com/reel/C0EMNFOyhIk/", "caption": "New opening: @chinatownbakery_london presents Tong Tea🧋\n\nA new spot has landed in Chinatown, serving up delicious Tong Tea and Chinatown Bakery goods 🙌 \n\nThis new spot is located at 9 Wardour Street📍\n\n#chinatownlondon #newopening #londonopenings #tongtea #bubbleteaspot #chinatownbakery", "owner": "Chinatown London", "category": "restaurant/food", "rating": null, "rating_count": null, "price_level": null, "hours": null}, {"place_name": "AL DENTE, Goodge Street", "lat": 51.5191178, "lng": -0.136044, "address": "51 Goodge St, London W1T 1TG", "reel_url": "https://www.instagram.com/reel/CztNbKjIp17/", "caption": "🌟GREAT PASTA EATS🌟\nEveryone loves pasta…. Right? Here we have 3 top pasta eats for you in @london 🤗\n\n1. Al Dente @pastificioaldente\nℹ️ The house of fresh pasta specialising in handmade fresh pasta and traditional Italian recipes passed down through generations.\n📍Fitzrovia, Monument, South Kensington\n💰 ££\n\n2. Emilia’s @emiliaspasta\nℹ️ Fresh Italian pasta in a casual setting, using traditional techniques passed down through the generations.\n📍St Katherine Docks, Aldgate, Canary Wharf\n💰 ££\n\n3. Noci @nocipasta\nℹ️ Affordable fresh pasta restaurant inspired by Sicilian street food, which prides itself on its ever changing seasonal menu.\n📍Islington, Shoreditch, Battersea\n💰 ££\n\nIf you’ve ever liked our content, follow us and share with those you’d love to enjoy with 🥰\n.\n.\n.\n#foodtease #pasta #pastalover #pastapasta #seafoodlover #londonfood #londoneats #londonrestaurants #londonfoodblogger #londoncity #italianfood #secretlondon #eattheworld #londonlife #reelitfeelit #reelinstagram", "owner": "FOODTEASE_", "category": "activity", "rating": null, "rating_count": null, "price_level": null, "hours": null}, {"place_name": "Hello, Delight!", "lat": 51.5070246, "lng": -0.0922021, "address": "Borough Yards, Clink St, London SE1 9DG", "reel_url": "https://www.instagram.com/reel/CyaOvsQoqyT/", "caption": "Explore 25 media art installations with cutting-edge technology at Delight.\n\nFollowing much success in Seoul, Delight is an immersive art exhibition that showcases history and modern life side by side.\n\n⏳ Duration: the visit will take approx. 1 hour 📍 Location: Borough Yards, Clink St , London. SE1 9DG\n👤 Age requirement: 4+. Anyone under the age of 12 must be accompanied by an adult ♿ Accessibility: please be aware that this experience involves multiple steps and is only accessible in parts on the ground floor. The exhibition is partially wheelchair accessible; due to the building’s listing constraints, there is no access to the 1st floor \nTickets from £19 per adult, £11.40 for children aged 4-12. Tickets available until Jan 2024.\n\nBook tickets on @fever_uk app.\n\nInvite\n\n#feverambassador #feverup #letsdolondon #londonart #artinlondon #londonexhibition #londonexhibitions #immersiveexperience #immersiveart #londonweek #londonweekend #londontourist #londontourism #londontrip #londonblogger #londonbloggers #londondiaries #londonforyou #londonbylondoners #becauseimalondoner #explorelondon #discoverlondon #seelondon #visitlondon #borough #boroughmarket #lovelondon #londonlife #thingstodoinlondon", "owner": "London Family Days Out", "category": "activity", "rating": null, "rating_count": null, "price_level": null, "hours": null}, {"place_name": "The 411, Angel", "lat": 51.5314641, "lng": -0.1066709, "address": "411 St John St, London EC1V 4AB", "reel_url": "https://www.instagram.com/reel/CyObNbxr8ic/", "caption": "Wall Street meets Angel at this new bar! A great new spot to hangout with your mates! 📈📉 📍@the411london, Angel", "owner": "Secret London", "category": "restaurant/food", "rating": null, "rating_count": null, "price_level": null, "hours": null}, {"place_name": "Octaves, Stoke Newington", "lat": 51.5601531, "lng": -0.0737702, "address": "110 Stoke Newington High St, London N16 7NY", "reel_url": "https://www.instagram.com/reel/CxnzA8fojpl/", "caption": "Where to?: Octaves Kitchen (Stoke Newington) @octaveskitchen \n\nWould I recommend this restaurant: ✅\n\nCost: Buffet - £20pp Adults / £10pp Children\n\nWe had:\n🍸 Lychee Rose Martini (£12.50)\n🍹 Sunshine Rum Punch Jug (£17)\n🐐 Curry Goat\n🥘 Braised Oxtail\n🦐 Peppered Prawns\n🍳 Ackee Fried Rice\n🧀 Mini Mac Cheese\n🍚 Rice & Peas\n🍌 Plantain\n🐟 Saltfish Fritters\n🥬 Coleslaw\n🥔 Potato Salad\n\nMy experience: Octaves is a NEW All You Can Eat Caribbean Buffet that just opened this month is Stoke Newington 🥳🙌🏽. I travelled an hour and a half to get there and it was soooo worth it! 😍\n\nI had a jug of their rum punch and was already feeling a bit tipsy before the food arrived 😅. My friend had their Lychee Rose Martini which was nice too 😋. I love that their Sunshine Rum Punch, Guinness Punch & Peanut Punch are all vegan 🌱\n\nThe food is served in small tapas like dishes but is still veryyy filling. We only managed to get through two rounds (barely) before having to call it quits. Most of the food had a little pepper in it which I loved. Please don’t ever tone down the flavours! My favourites were the Saltfish Fritters and Ackee Fried Rice. I could eat them over and over 😍. We did have a little bit of food left at the end but was told it was £10 to take food away so we ended up leaving it 🥲\n\nAll of the food came out piping hot each time and I would say the wait times were similar to à la carte dining restaurants. I loved the range of food options and that you can order as many plates as you want at a time 🙌🏽\n\nOctaves Kitchen played Reggae while we were there and it was just the perfect atmosphere. I will 10000% be going back again; it’s such great value for money 🤩\n\nOn Sundays they add Jerk Chicken, Jollof Rice & Yorkshire Puddings to the menu. There’s also happy hour Thursday to Saturday from 5pm to 7pm 🥂\n\nAlso check the link in my bio for tickets to my upcoming event on Saturday 7th October\n@onthepunchgamesnights 🥳\n\n——\n#wheretoadventures #octaveskitchen #stokenewington #caribbeanbuffet #caribbeanfoodlondon #caribbeanrestaurants #londonfoodie #londonfoodblogger #bottomlessfood #toplondonrestaurants #cheaplondoneats #cheapeatslondon #discoverunder5k #wheretoeatlondon", "owner": "Where To Next? Activities, Food & Travel Content Creator", "category": "activity", "rating": null, "rating_count": null, "price_level": null, "hours": null}, {"place_name": "BURRO E SALVIA", "lat": 51.5242846, "lng": -0.0746523, "address": "52 Redchurch St, London E2 7DP", "reel_url": "https://www.instagram.com/reel/CwTAHiRo6A-/", "caption": "Pasta recommendation incoming 🍝 ad \n\n💸 £30-£35 pp. \n📍 Shoreditch \n🍝 Fresh pasta \n\n🇬🇧 If you work in Shoreditch/Old Street area, this is your lucky day! Meet Burro e Salvia, a small independent restaurant that makes unique pasta dishes drawing inspiration from regional dishes (I even found Sardinian malloreddus which are basically impossible to find in London). My favourite dish of the meal were the spinach and cheese fried parcels though, I hope they’re still on the menu. I found this restaurant through @yondercard, the perfect credit card for foodies that allows you to earn points and spend them on amazing restaurants, bars and lots of other experiences across London. It’s the only credit card I use and it gave me the chance to try so many new spots!!\n\n_________________\n\n🇮🇹 Se lavori nell’area di Shoreditch/Old Street, è il tuo giorno fortunato! Nella zona si trova Burro e Salvia, una piccola trattoria specializzato in pasta, che si ispira a varie specialità regionali (fanno persino i malloreddus sardi, praticamente introvabili a Londra). Il mio piatto preferito però son stati i fagottini fritti con spinaci e formaggio (antipasti), spero siano ancora nel menu!! Ho scoperto questo ristorante grazie a @yondercard, la carta di credito perfetta per gli amanti di cibo, che ti permette di accumulare punti e spenderli in ristoranti, bar e tante altre esperienze a Londra. È l’unica carta di credito che uso e mi ha dato la possibilità di provare moltissimi posti nuovi!!\n\nApproval is subject to eligibility. Over 18 & UK residents only. T&Cs apply. Membership fee applies. Representative 64% APR variable. Always pay the minimum monthly repayment otherwise your credit rating could be affected. Borrow responsibly and make sure you only borrow what you can afford to pay back.", "owner": "Elisabetta Basile | Italy Food & Travel", "category": "activity", "rating": null, "rating_count": null, "price_level": null, "hours": null}, {"place_name": "The Ice Cream Project by Anya Hindmarch", "lat": 51.4973402, "lng": -0.1570956, "address": "11 Pont St, London SW1X 9EH", "reel_url": "https://www.instagram.com/reel/CvC6JGONbQs/", "caption": "Tag your friends you want to go here with 🍦😅Come with me to the Ice Cream Project pop up in Chelsea 🍦✨ #icecream #london #comewithme #londonlife #londonfood #thingstodo", "owner": "Maddie (Macerly) Borge", "category": "restaurant/food", "rating": null, "rating_count": null, "price_level": null, "hours": null}, {"place_name": "Babylon Park", "lat": 51.5422171, "lng": -0.144926, "address": "8 Castlehaven Rd, London NW1 8QU", "reel_url": "https://www.instagram.com/reel/CvaIYxQoBXJ/", "caption": "Have you seen what is underground in Camden? 👽\n\n#camdentown #london #camden #babylonpark #babylonparkuk #babylonparklondon #rollercoaster #rollercoaster🎢", "owner": "Babylon Park", "category": "activity", "rating": null, "rating_count": null, "price_level": null, "hours": null}, {"place_name": "The Shell, Canary Wharf", "lat": 51.5009963, "lng": -0.0181376, "address": "3 S Quay Square, Canary Wharf, London E14 9RU", "reel_url": "https://www.instagram.com/reel/Ct8e02Ko0kx/", "caption": "French Seafood Mix Platter in London 🦐 *AD PR\n\n📍The Shell (Holborn or Canary Wharf)\n💷 £79.90 for two\n\nThis is a seafood lovers heaven. This is the shell in canary wharf and they specialise in french seafood 🥹\n\nWe got to try the hot lobster gratin mix platter and it was so fresh and flavourful 🔥\n\nOur platter had lobster, prawns, mussels, langoustine, scallops and oysters 🦞\n\nThe bottom of the platter also had some french fries which absorbed all of the flavour 🍟\n\n☑️ I highly recommend this spot if you love seafood. I was still hungry after sharing the platter between the two of us so I would also recommend getting a starter beforehand or dessert after.\n\n#wheninlondon #londonfoodguide #londonfoodie  #londonfoodblogger #londonhotspots #golondonfood #timeoutlondon #toplondoneats #wheretoeatlondon #londonfoodbabes #londonactivities #londonrestaurantguide #datenightideas #londondatenight #londondiaries #londonnightlife \n\nLondon foodie | London food blogger | London eats | Where to get Seafood platter in London | Where to eat in Canary Wharf", "owner": "Yen 🇵🇭 | London Food & Trav const CATS = {
  'restaurant/food': { label: 'Food & drink', varName: '--food' },
  'activity':         { label: 'Things to do', varName: '--activity' },
  'other':            { label: 'Other',        varName: '--muted-2' }
};

function cssVar(name) {
  return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
}

const map = L.map('map', { zoomControl: false, attributionControl: false }).setView([51.5074, -0.1278], 12);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(map);
L.control.attribution({ position: 'bottomleft', prefix: false }).addAttribution('&copy; OpenStreetMap').addTo(map);

function escapeHtml(s) {
  return (s || '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

// ---- smart initial view: trim outliers so we open on the main cluster, not all of Greater London ----
function haversine(a, b) {
  const R = 6371;
  const dLat = (b[0]-a[0]) * Math.PI/180, dLng = (b[1]-a[1]) * Math.PI/180;
  const s = Math.sin(dLat/2)**2 + Math.cos(a[0]*Math.PI/180)*Math.cos(b[0]*Math.PI/180)*Math.sin(dLng/2)**2;
  return 2*R*Math.asin(Math.sqrt(s));
}
function smartBounds(pins) {
  if (pins.length <= 3) return L.latLngBounds(pins.map(p => [p.lat, p.lng]));
  const lats = pins.map(p => p.lat), lngs = pins.map(p => p.lng);
  const centroid = [lats.reduce((a,b)=>a+b,0)/lats.length, lngs.reduce((a,b)=>a+b,0)/lngs.length];
  const withDist = pins.map(p => ({p, d: haversine(centroid, [p.lat, p.lng])})).sort((a,b) => a.d - b.d);
  const keep = withDist.slice(0, Math.ceil(withDist.length * 0.82));
  return L.latLngBounds(keep.map(x => [x.p.lat, x.p.lng]));
}

let markers = [];
let currentFilter = 'all';
let selectedIdx = null;
let searchTerm = '';
let userMarker = null;

const CAT_ICON = {
  'restaurant/food': '<path d="M7 2v7a2 2 0 0 0 2 2h0a2 2 0 0 0 2-2V2M9 11v11M15 2c-1.5 1-2 3-2 5s.5 3 2 4v10" stroke-linecap="round" stroke-linejoin="round"/>',
  'activity': '<path d="M4 8a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v2a2 2 0 0 0 0 4v2a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2v-2a2 2 0 0 0 0-4z" stroke-linecap="round" stroke-linejoin="round"/><line x1="12" y1="6" x2="12" y2="18" stroke-dasharray="2 2"/>',
  'other': '<path d="M12 21s7-6.4 7-12a7 7 0 1 0-14 0c0 5.6 7 12 7 12z" stroke-linecap="round" stroke-linejoin="round"/><circle cx="12" cy="9" r="2.4"/>'
};
const ICON_PLAY = '<path d="M8 5.5v13l11-6.5z" fill="currentColor" stroke="none"/>';
const ICON_DIRECTIONS = '<path d="M3 11l18-7-7 18-3-8-8-3z" stroke-linecap="round" stroke-linejoin="round"/>';
const ICON_PIN = '<path d="M12 21s7-6.4 7-12a7 7 0 1 0-14 0c0 5.6 7 12 7 12z" stroke-linecap="round" stroke-linejoin="round"/><circle cx="12" cy="9" r="2.4"/>';
const ICON_FILM = '<rect x="3" y="4" width="18" height="16" rx="2"/><line x1="7" y1="4" x2="7" y2="20"/><line x1="17" y1="4" x2="17" y2="20"/><line x1="3" y1="9" x2="7" y2="9"/><line x1="3" y1="15" x2="7" y2="15"/><line x1="17" y1="9" x2="21" y2="9"/><line x1="17" y1="15" x2="21" y2="15"/>';

function svg(paths, size) {
  return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${paths}</svg>`;
}

function shortLabel(name) {
  const words = name.split(' ');
  return words.length <= 2 ? name : words.slice(0, 2).join(' ');
}

function makeIcon(cat, selected, placeName) {
  const colorHex = cssVar(CATS[cat] ? CATS[cat].varName : '--muted-2');
  const glyph = CAT_ICON[cat] || CAT_ICON['other'];
  const label = shortLabel(placeName);
  const badgeWidth = Math.min(170, 24 + label.length * 6.6);
  return L.divIcon({
    className: '',
    html: `<div class="pin-wrap ${selected ? 'selected' : ''}" style="--pin-color:${colorHex}; position:relative; display:flex; align-items:center; justify-content:center; width:30px; height:30px;">
             <div class="pin-badge" style="width:${badgeWidth}px;">${escapeHtml(label)}</div>
             <div class="map-pin" style="background:${colorHex}; color:#fff;">${svg(glyph, 14)}</div>
           </div>`,
    iconSize: [30, 30],
    iconAnchor: [15, 30]
  });
}

function todayHoursLine(hours) {
  if (!hours || !hours.length) return null;
  // JS getDay(): 0=Sun..6=Sat; our array is Mon..Sun (index 0=Mon)
  const jsDay = new Date().getDay();
  const idx = jsDay === 0 ? 6 : jsDay - 1;
  const line = hours[idx] || '';
  return line.replace(/^(Mon|Tue|Wed|Thu|Fri|Sat|Sun):\s*/, '');
}

const ICON_STAR = '<path d="M12 2l2.9 6.9L22 9.3l-5.3 4.8L18.2 21 12 17.3 5.8 21l1.5-6.9L2 9.3l7.1-.4z" fill="currentColor" stroke="none"/>';
const ICON_CLOCK = '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3" stroke-linecap="round"/>';

function openSheet(p, idx) {
  selectedIdx = idx;
  renderMarkers();
  const cat = CATS[p.category] || CATS['other'];
  const colorHex = cssVar(cat.varName);
  const mapsUrl = `https://maps.apple.com/?daddr=${encodeURIComponent(p.address)}&ll=${p.lat},${p.lng}`;
  const ratingHtml = p.rating != null
    ? `<span class="sheet-rating">${svg(ICON_STAR, 13)}${p.rating.toFixed(1)}<span class="sheet-rating-count">(${p.rating_count})</span></span>`
    : '';
  const todayLine = todayHoursLine(p.hours);
  document.getElementById('sheetContent').innerHTML = `
    <div class="sheet-top-row">
      <span class="sheet-cat" style="background:${colorHex}"><span class="dot"></span>${cat.label}</span>
      ${ratingHtml}
    </div>
    <div class="sheet-title">${escapeHtml(p.place_name)}</div>
    <div class="action-row">
      <a class="action-btn" href="${mapsUrl}" target="_blank" rel="noopener">
        <div class="action-btn-circle" style="background:${colorHex}">${svg(ICON_DIRECTIONS, 17)}</div>
        <span>Directions</span>
      </a>
      <a class="action-btn" href="${p.reel_url}" target="_blank" rel="noopener">
        <div class="action-btn-circle" style="background:${colorHex}">${svg(ICON_PLAY, 17)}</div>
        <span>Reel</span>
      </a>
    </div>
    <div class="sheet-caption">${escapeHtml(p.caption)}</div>
    <div class="info-rows">
      <div class="info-row">
        <div class="info-row-icon" style="color:${colorHex}">${svg(ICON_PIN, 16)}</div>
        <div class="info-row-text"><div class="info-row-label">Address</div>${escapeHtml(p.address)}</div>
      </div>
      ${todayLine ? `<div class="info-row">
        <div class="info-row-icon" style="color:${colorHex}">${svg(ICON_CLOCK, 16)}</div>
        <div class="info-row-text"><div class="info-row-label">Today</div>${escapeHtml(todayLine)}</div>
      </div>` : ''}
      <div class="info-row">
        <div class="info-row-icon" style="color:${colorHex}">${svg(ICON_FILM, 16)}</div>
        <div class="info-row-text"><div class="info-row-label">Spotted via</div>@${escapeHtml(p.owner)}</div>
      </div>
    </div>`;
  document.getElementById('sheet').classList.add('show');
  document.getElementById('overlay').classList.add('show');
}

function closeSheet() {
  document.getElementById('sheet').classList.remove('show');
  document.getElementById('overlay').classList.remove('show');
  selectedIdx = null;
  renderMarkers();
}
document.getElementById('overlay').addEventListener('click', closeSheet);

function matchesSearch(p, term) {
  if (!term) return true;
  const hay = (p.place_name + ' ' + p.caption + ' ' + p.address).toLowerCase();
  return hay.includes(term);
}

function visiblePins() {
  const term = searchTerm.trim().toLowerCase();
  return PINS.map((p, i) => ({p, i})).filter(({p}) =>
    (currentFilter === 'all' || p.category === currentFilter) && matchesSearch(p, term)
  );
}

function renderMarkers() {
  markers.forEach(m => map.removeLayer(m));
  markers = [];
  const visible = visiblePins();
  visible.forEach(({p, i}) => {
    const marker = L.marker([p.lat, p.lng], { icon: makeIcon(p.category, i === selectedIdx, p.place_name) });
    marker.on('click', () => openSheet(p, i));
    marker.addTo(map);
    markers.push(marker);
  });
  document.getElementById('statRow').innerHTML = `<b>${visible.length}</b> of <b>${PINS.length}</b> spots mapped &middot; 414 saved reels total, still adding`;
}

function renderChips() {
  const container = document.getElementById('chipRow');
  const counts = { all: PINS.length };
  Object.keys(CATS).forEach(k => counts[k] = PINS.filter(p => p.category === k).length);
  const defs = [{ key: 'all', label: 'All', varName: null }].concat(
    Object.keys(CATS).filter(k => counts[k] > 0).map(k => ({ key: k, label: CATS[k].label, varName: CATS[k].varName }))
  );
  container.innerHTML = '';
  defs.forEach(d => {
    const btn = document.createElement('button');
    btn.className = 'chip glass' + (d.key === currentFilter ? ' active' : '');
    const dotHtml = d.varName ? `<span class="dot" style="background:${cssVar(d.varName)}"></span>` : '';
    btn.innerHTML = `${dotHtml}${d.label} (${counts[d.key]})`;
    btn.onclick = () => { currentFilter = d.key; closeSheet(); renderChips(); renderMarkers(); };
    container.appendChild(btn);
  });
}

document.getElementById('searchInput').addEventListener('input', (e) => {
  searchTerm = e.target.value;
  closeSheet();
  renderMarkers();
});

document.getElementById('locateBtn').addEventListener('click', () => {
  const btn = document.getElementById('locateBtn');
  if (!navigator.geolocation) { alert('Location is not available in this browser.'); return; }
  btn.style.opacity = '0.4';
  navigator.geolocation.getCurrentPosition((pos) => {
    const { latitude, longitude } = pos.coords;
    btn.classList.add('active');
    btn.style.opacity = '1';
    if (userMarker) map.removeLayer(userMarker);
    userMarker = L.marker([latitude, longitude], {
      icon: L.divIcon({ className: '', html: '<div class="user-dot"></div>', iconSize: [16,16], iconAnchor: [8,8] })
    }).addTo(map);
    map.setView([latitude, longitude], 15, { animate: true });
  }, () => {
    btn.style.opacity = '1';
    alert('Could not get your location. Check that location access is allowed for this page.');
  });
});

document.getElementById('themeToggle').onclick = () => {
  const root = document.documentElement;
  const isDark = root.getAttribute('data-theme') === 'dark';
  root.setAttribute('data-theme', isDark ? 'light' : 'dark');
  renderChips();
  renderMarkers();
  if (selectedIdx !== null) openSheet(PINS[selectedIdx], selectedIdx);
};

renderChips();
renderMarkers();

if (PINS.length) {
  map.fitBounds(smartBounds(PINS), { padding: [50, 50], maxZoom: 15 });
}
</script>
