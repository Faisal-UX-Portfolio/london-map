<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Faisal's London</title>
<meta name="description" content="London places worth going to, saved from Instagram Reels.">

<!-- iOS home-screen install is driven by these meta tags, not by manifest.json -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="London">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="manifest" href="manifest.json">

<link rel="stylesheet" href="vendor/leaflet-1.9.4.css">
<link rel="stylesheet" href="style.css">
<script>
  // Set the theme before first paint so the map tiles never flash the wrong way.
  try {
    var t = localStorage.getItem('theme');
    if (!t) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    document.documentElement.dataset.theme = t;
  } catch (e) { document.documentElement.dataset.theme = 'light'; }
</script>
</head>
<body>
<div id="app">
  <div id="map"></div>

  <div class="chrome-top">
    <div class="header-card glass">
      <div class="header-row">
        <span class="wordmark">Faisal's <em>London</em></span>
        <span class="count" id="count"></span>
      </div>
      <div class="search-row">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input type="search" id="searchInput" placeholder="Search places, food, vibes…"
               autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"
               enterkeyhint="search" aria-label="Search places">
        <button class="clear-btn" id="clearBtn" aria-label="Clear search">
          <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round"><line x1="5" y1="5" x2="19" y2="19"/><line x1="19" y1="5" x2="5" y2="19"/></svg>
        </button>
      </div>
    </div>
    <div class="chip-row" id="chipRow" role="group" aria-label="Filters"></div>
  </div>

  <div class="side-rail">
    <button class="rail-btn glass" id="listBtn" aria-label="Show list of places">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><circle cx="3.5" cy="6" r="1.3" fill="currentColor" stroke="none"/><circle cx="3.5" cy="12" r="1.3" fill="currentColor" stroke="none"/><circle cx="3.5" cy="18" r="1.3" fill="currentColor" stroke="none"/></svg>
    </button>
    <button class="rail-btn glass" id="locateBtn" aria-label="Find places near me">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3.2"/><path d="M12 2v3.4M12 18.6V22M2 12h3.4M18.6 12H22"/></svg>
    </button>
    <button class="rail-btn glass" id="themeBtn" aria-label="Switch between light and dark">
      <svg id="themeIcon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
    </button>
  </div>

  <div class="scrim" id="scrim"></div>
  <div class="sheet glass" id="sheet" role="dialog" aria-modal="false" aria-label="Place details">
    <div class="sheet-grip"></div>
    <div class="sheet-body" id="sheetBody"></div>
  </div>

  <div class="toast glass" id="toast" role="status" aria-live="polite"></div>
</div>

<script src="vendor/leaflet-1.9.4.js"></script>
<script src="app.js"></script>
</body>
</html>
